name: Prescription contract regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_server.py test_nexo_adapter.py test_prescription_contract.py
        working-directory: Receita_PED_Repositorio_Railway
